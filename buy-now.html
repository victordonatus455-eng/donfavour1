<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now - Don Favour</title>
    <link rel="stylesheet" href="buy.css">
</head>

<body>

<header>
    <h1>Rest Easy, Dream Big</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact us.html">Contact Us</a>
    </nav>
</header>

<main class="checkout-container">

    <div class="checkout-card">

        <h2>Place Your Order</h2>

        <form id="checkoutForm">

            <label for="product">Select Your Pillow</label>

            <select id="product" name="product" required>

                <option value="">-- Select a Pillow --</option>

                <option value="Classic White Pillow" data-price="8500">
                    Classic White Pillow - ₦8,500
                </option>

                <option value="Luxury Soft Pillow" data-price="12000">
                    Luxury Soft Pillow - ₦12,000
                </option>

                <option value="Decorative Cushion" data-price="7000">
                    Decorative Cushion - ₦7,000
                </option>

                <option value="Velvet Comfort Pillow" data-price="10000">
                    Velvet Comfort Pillow - ₦10,000
                </option>

                <option value="Pink Dream Pillow" data-price="7500">
                    Pink Dream Pillow - ₦7,500
                </option>

                <option value="Round Comfort Pillow" data-price="9000">
                    Round Comfort Pillow - ₦9,000
                </option>

                <option value="Premium Cushion" data-price="14000">
                    Premium Cushion - ₦14,000
                </option>

                <option value="Grey Soft Pillow" data-price="8000">
                    Grey Soft Pillow - ₦8,000
                </option>

                <option value="Modern Home Pillow" data-price="11000">
                    Modern Home Pillow - ₦11,000
                </option>

                <option value="Elegant Sofa Pillow" data-price="13000">
                    Elegant Sofa Pillow - ₦13,000
                </option>

                <option value="Premium Fibre Pillow" data-price="19000">
                    Premium Fibre Pillow - ₦19,000
                </option>

                <option value="Luxury Decorative Pillow" data-price="22000">
                    Luxury Decorative Pillow - ₦22,000
                </option>

            </select>


            <div class="product-box">

                <p>
                    <strong>Price:</strong>
                    ₦<span id="productPrice">0</span>
                </p>

            </div>


            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                required
                placeholder="Enter your full name"
            >


            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                required
                placeholder="Enter your email"
            >


            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                required
                placeholder="Enter your phone number"
            >


            <label for="quantity">Quantity</label>

            <input
                type="number"
                id="quantity"
                min="1"
                value="1"
                required
            >


            <label for="address">Delivery Address</label>

            <textarea
                id="address"
                rows="4"
                required
                placeholder="Enter your delivery address"
            ></textarea>


            <div class="total-box">

                <strong>Total:</strong>

                <span>
                    ₦<span id="totalPrice">0</span>
                </span>

            </div>


            <button type="submit" id="payButton">
                Pay Now
            </button>

            <p id="message"></p>

        </form>

    </div>

</main>


<script>

const productSelect =
    document.getElementById("product");

const productPrice =
    document.getElementById("productPrice");

const quantityInput =
    document.getElementById("quantity");

const totalPrice =
    document.getElementById("totalPrice");

const checkoutForm =
    document.getElementById("checkoutForm");

const payButton =
    document.getElementById("payButton");

const message =
    document.getElementById("message");


let selectedPrice = 0;


/* Format Nigerian Naira */

function formatMoney(amount) {

    return Number(amount).toLocaleString("en-NG");

}


/* Update selected product */

function updateProduct() {

    const selectedOption =
        productSelect.options[
            productSelect.selectedIndex
        ];

    selectedPrice =
        Number(
            selectedOption.dataset.price
        ) || 0;


    productPrice.textContent =
        formatMoney(selectedPrice);


    updateTotal();

}


/* Calculate total */

function updateTotal() {

    const quantity =
        Number(quantityInput.value) || 1;

    const total =
        selectedPrice * quantity;


    totalPrice.textContent =
        formatMoney(total);

}


/* Product selection */

productSelect.addEventListener(
    "change",
    updateProduct
);


/* Quantity */

quantityInput.addEventListener(
    "input",
    updateTotal
);


/* Submit order */

checkoutForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!productSelect.value) {

            message.textContent =
                "Please select a pillow.";

            message.style.color = "red";

            return;

        }


        payButton.disabled = true;

        payButton.textContent =
            "Connecting to Paystack...";


        message.textContent = "";


        const customer = {

            name:
                document.getElementById("name").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            phone:
                document.getElementById("phone").value.trim(),

            address:
                document.getElementById("address").value.trim(),

            product:
                productSelect.value,

            quantity:
                Number(quantityInput.value)

        };


        try {

            const response =
                await fetch(
                    "/api/payment/initialize",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(customer)
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.authorization_url
            ) {

                throw new Error(
                    data.message ||
                    "Unable to start payment."
                );

            }


            /* Send customer to real Paystack checkout */

            window.location.href =
                data.authorization_url;


        } catch (error) {

            message.textContent =
                error.message;

            message.style.color = "red";


            payButton.disabled = false;

            payButton.textContent =
                "Pay Now";

        }

    }
);
/* Format Money */
function formatMoney(amount) {
    return Number(amount).toLocaleString("en-NG");
}

/* Update Product */
function updateProduct() {

    const selectedOption =
        productSelect.options[productSelect.selectedIndex];

    selectedPrice =
        Number(selectedOption.dataset.price) || 0;

    productPrice.textContent =
        formatMoney(selectedPrice);

    updateTotal();
}

/* Update Total */
function updateTotal() {

    const quantity =
        Number(quantityInput.value) || 1;

    const total =
        selectedPrice * quantity;

    totalPrice.textContent =
        formatMoney(total);
}

productSelect.addEventListener("change", updateProduct);
quantityInput.addEventListener("input", updateTotal);

/* Submit Form */
checkoutForm.addEventListener("submit", function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const phone =
        document.getElementById("phone").value;

    const address =
        document.getElementById("address").value;

    const product =
        productSelect.value;

    const quantity =
        quantityInput.value;

    const total =
        totalPrice.textContent;

    /* Replace with your WhatsApp number */
    const whatsappNumber = "2347061866093";

    const message =
`🛒 NEW ORDER - DON FAVOUR

Name: ${name}

Email: ${email}

Phone: ${phone}

Product: ${product}

Quantity: ${quantity}

Total: ₦${total}

Address:
${address}`;

    const url =
        `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

    window.open(url, "_blank");
})



</script>





</body>
</html>
